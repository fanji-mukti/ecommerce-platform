<div class="login-page">
  <mat-card class="login-card">
    <mat-card-header>
      <mat-card-title>Sign In</mat-card-title>
      <mat-card-subtitle>Welcome back. Sign in to continue.</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <p class="info-hint">You'll be redirected to complete sign in securely.</p>
    </mat-card-content>
    <mat-card-actions>
      <button mat-raised-button color="accent" class="full-width" (click)="authorize()">
        Sign In
      </button>
    </mat-card-actions>
  </mat-card>

  <p class="register-link">
    Don't have an account?
    <a routerLink="/register">Register</a>
  </p>
</div>
